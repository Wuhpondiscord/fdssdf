name: One-shot README Naibbe update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-readme-naibbe.yml"

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Naibbe status into README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()

          implemented_marker = "- **Line-start decomposition** (`currier_linestart.py`): paragraph-first versus other-line JSD, six-glyph enrichment, Currier-stratified JSD, relabel nulls, and quire bootstrap, with executable parity checked against the authors' pinned script.\n"
          implemented_insert = implemented_marker + (
              "- **Naibbe meaningful-cipher baseline** (`generators.py`): the paper-facing 52-card `naibbe.py` algorithm, exact 414-row substitution table, isolated seeded RNG, and provenance metadata. CI compares seeded plaintext respacing, canonical ciphertext, final 3%-space-dropped ciphertext, and ambiguity retry count directly against the pinned original implementation.\n"
          )
          assert text.count(implemented_marker) == 1, "unexpected implemented-list marker"
          assert "**Naibbe meaningful-cipher baseline**" not in text
          text = text.replace(implemented_marker, implemented_insert, 1)

          anchor = "## Hugging Face target\n"
          assert text.count(anchor) == 1, "unexpected Hugging Face section marker"
          section = '''## Meaningful-cipher generator baseline: Naibbe

Naibbe is intentionally kept separate from the N0–N6 null-surrogate ladder. It consumes meaningful plaintext and produces Voynich-like ciphertext, so placing it in the same dropdown as corpus-preserving null models would conflate two different experimental questions.

The implementation pins `greshko/naibbe-cipher` at commit:

```text
f2675ec5dd275268bc64dd48ea64fc0e0e9827a2
```

The baseline follows the paper-facing `naibbe.py` defaults: respacing parameter 17, 52-card deck, 3% random output-space removal, and ambiguity-safe bigrams that reject accidental unigram glyph types. The imported `references/naibbe_tables.csv` is byte-identical to the pinned upstream asset (414 mapping rows).

`.github/workflows/naibbe-equivalence.yml` downloads and executes that exact upstream implementation, then requires exact equality with this repository for seeded respaced plaintext, canonical ciphertext, final respaced ciphertext, and ambiguity retry count. The local wrapper uses a private `random.Random(seed)` so Naibbe generation does not perturb the global RNG state used by other experiments.

The newer upstream `naibbe_v2.py` is not silently substituted: it changes the default to a 78-card deck and adds an additional cross-bigram collision rule, so it is treated as a distinct future generator variant. Third-party licensing and the requested paper citation are recorded in `THIRD_PARTY_NOTICES.md`.

'''
          text = text.replace(anchor, section + anchor, 1)

          old_gap = "1. **Generator library.** No Naibbe, self-citation, or grille-cipher generator is implemented yet. For reportable comparisons, prefer the original authors' released implementations over an approximation reconstructed only from prose, and keep meaningful-cipher and meaningless-pseudotext generator families separate."
          new_gap = "1. **Generator library.** The paper-facing Naibbe 52-card baseline is implemented and source-equivalence-checked, and it remains explicitly classified as a meaningful-plaintext cipher rather than a null surrogate. The remaining generator gaps are the Timm/Schinner self-citation pseudotext family and a reproducible Rugg-style grille-cipher implementation; for both, prefer original authors' released code/data over prose-only approximations and preserve the meaningful-cipher versus meaningless-pseudotext distinction."
          assert text.count(old_gap) == 1, "unexpected generator-gap text"
          text = text.replace(old_gap, new_gap, 1)

          path.write_text(text)
          PY
          grep -F "Naibbe meaningful-cipher baseline" README.md
          grep -F "naibbe-equivalence.yml" README.md
          grep -F "remaining generator gaps" README.md
      - name: Commit README update
        run: |
          if git diff --quiet -- README.md; then
            echo "No README changes were produced" >&2
            exit 1
          fi
          git config user.name "Wuhp"
          git config user.email "130805430+Wuhpondiscord@users.noreply.github.com"
          git add README.md
          git commit -m "Document validated Naibbe generator baseline"
          git push origin HEAD:main
