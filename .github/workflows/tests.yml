name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.26,<3" "scipy>=1.13,<2" "scikit-learn>=1.4,<2" "pytest>=8,<9"
      - name: Compile Python sources
        run: |
          python -m py_compile app.py
          python -m compileall -q src/voynich_lab tests
      - name: Run tests
        run: python -m pytest -q
