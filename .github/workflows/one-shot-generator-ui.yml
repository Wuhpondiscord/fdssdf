name: One-shot generator UI patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/one-shot-generator-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply guarded patch
        run: python scripts/patch_generator_ui.py
      - name: Compile patched Python
        run: python -m py_compile app.py src/voynich_lab/generator_adapters.py src/voynich_lab/selfcitation_generator.py
      - name: Validate diff
        run: git diff --check
      - name: Commit generated patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- app.py README.md; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "Wuhp"
          git config user.email "130805430+Wuhpondiscord@users.noreply.github.com"
          git add app.py README.md
          git commit -m "Expose validated generator baselines in Gradio"
          git push origin HEAD:main
