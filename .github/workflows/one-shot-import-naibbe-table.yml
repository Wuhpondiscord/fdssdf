name: One-shot Naibbe table import

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-import-naibbe-table.yml"

permissions:
  contents: write

jobs:
  import-table:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import pinned upstream table
        run: |
          set -euo pipefail
          mkdir -p src/voynich_lab/data
          url="https://raw.githubusercontent.com/greshko/naibbe-cipher/f2675ec5dd275268bc64dd48ea64fc0e0e9827a2/references/naibbe_tables.csv"
          curl --fail --location --silent --show-error "$url" -o src/voynich_lab/data/naibbe_tables.csv
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path("src/voynich_lab/data/naibbe_tables.csv")
          with p.open("r", encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))
          assert len(rows) == 414, f"unexpected Naibbe row count: {len(rows)}"
          assert set(rows[0]) == {"code", "glyphs"}
          assert any(r["code"] == "unigram_alpha_a" and r["glyphs"] == "ol" for r in rows)
          assert any(r["code"] == "suffix_gamma2_z" and r["glyphs"] == "alsy" for r in rows)
          print(f"validated {len(rows)} Naibbe mapping rows")
          PY
      - name: Commit pinned table
        run: |
          if [ -z "$(git status --porcelain -- src/voynich_lab/data/naibbe_tables.csv)" ]; then
            echo "No table changes were produced" >&2
            exit 1
          fi
          git config user.name "Wuhp"
          git config user.email "130805430+Wuhpondiscord@users.noreply.github.com"
          git add src/voynich_lab/data/naibbe_tables.csv
          git commit -m "Import pinned Naibbe mapping table"
          git push origin HEAD:main
