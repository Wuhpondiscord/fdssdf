name: One-shot Currier UI patch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-currier-ui.yml"

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Currier report UI into app.py
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app.py")
          text = path.read_text()

          import_needle = "from voynich_lab.discriminator import classifier_two_sample_test\n"
          import_insert = (
              "from voynich_lab.currier_report import build_currier_report\n"
              + import_needle
          )
          assert text.count(import_needle) == 1, "unexpected discriminator import marker"
          assert "from voynich_lab.currier_report import build_currier_report" not in text
          text = text.replace(import_needle, import_insert, 1)

          function_marker = "# Every generator exposed to scorecard/discriminator obeys the same\n"
          assert text.count(function_marker) == 1, "unexpected generator marker"
          function = '''def run_currier_ui(raw_text: str, bootstrap_repetitions: int, seed: int):
              if not raw_text.strip() or not is_ivtff(raw_text):
                  raise gr.Error("Currier analysis requires IVTFF input with native $L and $Q metadata.")
              try:
                  report = build_currier_report(
                      raw_text,
                      boundary_bootstrap_repetitions=int(bootstrap_repetitions),
                      seed=int(seed),
                  )
              except ValueError as exc:
                  raise gr.Error(str(exc)) from exc
              return (
                  pd.DataFrame(report["boundary_rows"]),
                  pd.DataFrame(report["stratum_rows"]),
                  pd.DataFrame(report["bootstrap_rows"]),
                  report["interpretation"],
                  pd.DataFrame(report["line_start_jsd_rows"]),
                  pd.DataFrame(report["line_start_enrichment_rows"]),
                  json.dumps(report["provenance"], indent=2, sort_keys=True),
              )


          '''
          text = text.replace(function_marker, function + function_marker, 1)

          tab_marker = '    with gr.Tab("5 · Long-range structure"):\n'
          assert text.count(tab_marker) == 1, "unexpected long-range tab marker"
          currier_tab = '''    with gr.Tab("5 · Currier A/B"):
              gr.Markdown(
                  "Currier A/B boundary profiles use separate within-stratum PMI scales. "
                  "A−B uncertainty is resampled by native quire under both independent-stratum and joint-quire schemes; "
                  "do not treat a pooled A/B point difference as an independent dialect effect."
              )
              with gr.Row():
                  currier_bootstrap = gr.Slider(20, 1500, value=200, step=20, label="Quire bootstrap draws")
                  currier_seed = gr.Number(value=20260808, precision=0, label="Seed")
              currier_btn = gr.Button("Run Currier A/B analysis", variant="primary")
              currier_boundary = gr.Dataframe(label="Boundary profiles: stratum-local indices", interactive=False)
              currier_strata = gr.Dataframe(label="Currier stratum summary", interactive=False)
              currier_bootstrap_table = gr.Dataframe(label="A−B quire-bootstrap intervals", interactive=False)
              currier_interpretation = gr.Textbox(label="Interpretation", lines=5, interactive=False)
              gr.Markdown(
                  "#### Line-start executable reproduction vs bundled STATED constants\n"
                  "These tables reproduce the authors' pinned final executable. They deliberately show its output next to the "
                  "same upstream file's older hard-coded STATED constants rather than forcing one to match the other."
              )
              currier_jsd = gr.Dataframe(label="Line-start JSD: executable vs STATED", interactive=False)
              currier_enrichment = gr.Dataframe(label="Line-start enrichment: executable vs STATED", interactive=False)
              currier_provenance = gr.Code(label="Method provenance", language="json")
              currier_btn.click(
                  run_currier_ui,
                  [raw_state, currier_bootstrap, currier_seed],
                  [
                      currier_boundary,
                      currier_strata,
                      currier_bootstrap_table,
                      currier_interpretation,
                      currier_jsd,
                      currier_enrichment,
                      currier_provenance,
                  ],
              )

          '''
          text = text.replace(tab_marker, currier_tab + '    with gr.Tab("6 · Long-range structure"):\n', 1)

          renames = {
              '    with gr.Tab("6 · Adversarial validation"):\n': '    with gr.Tab("7 · Adversarial validation"):\n',
              '    with gr.Tab("7 · Replication gate"):\n': '    with gr.Tab("8 · Replication gate"):\n',
              '    with gr.Tab("8 · Optional ZeroGPU probe"):\n': '    with gr.Tab("9 · Optional ZeroGPU probe"):\n',
              '    with gr.Tab("9 · Hugging Face sync"):\n': '    with gr.Tab("10 · Hugging Face sync"):\n',
          }
          for old, new in renames.items():
              assert text.count(old) == 1, f"unexpected tab marker: {old.strip()}"
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          python -m py_compile app.py
          python -m compileall -q src/voynich_lab tests
      - name: Commit patched UI
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes were produced" >&2
            exit 1
          fi
          git config user.name "Wuhp"
          git config user.email "130805430+Wuhpondiscord@users.noreply.github.com"
          git add app.py
          git commit -m "Expose Currier A/B analysis in app"
          git push origin HEAD:main
